apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-maintenance-ui
  labels:
    app: predictive-maintenance-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictive-maintenance-ui
  template:
    metadata:
      labels:
        app: predictive-maintenance-ui
    spec:
      containers:
        - name: ui
          image: predictive-maintenance-mlops-ui:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - streamlit
            - run
            - src/ui/streamlit_app.py
            - --server.address
            - 0.0.0.0
            - --server.port
            - "8501"
            - --server.headless
            - "true"
            - --browser.gatherUsageStats
            - "false"
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://predictive-maintenance-api:8080"
            - name: API_PUBLIC_URL
              value: "http://localhost:30080"
            - name: GRAFANA_URL
              value: "http://localhost:30300"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: PROMETHEUS_PUBLIC_URL
              value: "http://localhost:30099"
            - name: MLFLOW_URL
              value: "http://localhost:30500"
            - name: MLFLOW_API_URL
              value: "http://mlflow:5000"
            - name: MINIO_URL
              value: "http://localhost:30091"
            - name: PYTHONPATH
              value: "/app/src:/app"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: predictive-maintenance-ui
  labels:
    app: predictive-maintenance-ui
spec:
  type: NodePort
  selector:
    app: predictive-maintenance-ui
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30085
