apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: "fastapi_app"
        static_configs:
          - targets: ["predictive-maintenance-api:8080"]
  alert_rules.yml: |
    groups:
      - name: drift-alerts
        rules:
          - alert: DataDriftDetected
            expr: data_drift_detected == 1
            for: 0s
            labels:
              severity: warning
              drift_type: data
            annotations:
              summary: "Data drift detected"
              description: "The latest data drift flag is active."

          - alert: TargetDriftDetected
            expr: target_drift_detected == 1
            for: 0s
            labels:
              severity: warning
              drift_type: target
            annotations:
              summary: "Target drift detected"
              description: "The latest target drift flag is active."

          - alert: ConceptDriftDetected
            expr: concept_drift_detected == 1
            for: 0s
            labels:
              severity: critical
              drift_type: concept
            annotations:
              summary: "Concept drift detected"
              description: "The latest concept drift flag is active."

          - alert: AnyDriftDetected
            expr: data_drift_detected == 1 or target_drift_detected == 1 or concept_drift_detected == 1
            for: 0s
            labels:
              severity: warning
              drift_type: any
            annotations:
              summary: "At least one drift type is active"
              description: "Data, target, or concept drift is currently detected."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-config
              mountPath: /etc/prometheus/alert_rules.yml
              subPath: alert_rules.yml
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30099
