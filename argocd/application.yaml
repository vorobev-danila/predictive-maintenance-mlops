apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: predictive-maintenance-mlops
  namespace: argocd
  labels:
    app.kubernetes.io/name: predictive-maintenance-mlops
spec:
  project: default
  source:
    repoURL: https://github.com/vorobev-danila/predictive-maintenance-mlops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
